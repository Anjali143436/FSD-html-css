<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>block and inline tags</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <h2>Block and Inline Tags</h2>
    <table>
        <tr>
            <th>Block Tags</th>
            <th>Inline Tags</th>
        </tr>
        <tr>
            <td>&lt;div&gt;</td>
            <td>&lt;span&gt;</td>
        </tr>
        <tr>
            <td>&lt;p&gt;</td>
            <td>&lt;strong&gt;</td>
        </tr>
        <tr>
            <td>&lt;h1&gt; to &lt;h6&gt;</td>
            <td>&lt;small&gt;</td>
        </tr>
        <tr>
            <td>&lt;section&gt;</td>
            <td>&lt;a&gt;</td>
        </tr>
        <tr>
            <td>&lt;header&gt;</td>
            <td>&lt;img&gt;</td>
        </tr>
        <tr>
            <td>&lt;footer&gt;</td>
            <td>&lt;label&gt;</td>
        </tr>
    </table>
    
</body>
</html>
